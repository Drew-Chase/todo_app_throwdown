[workspace]
resolver = "3"
members = ["crates/shared", "crates/egui", 'crates/gpui', "crates/iced", "crates/tauri/src-tauri", "crates/aurora_leaf"]
default-members = ["crates/shared", "crates/egui", 'crates/gpui', "crates/iced"]

[workspace.dependencies]
tracing = { version = "0.1", features = ["max_level_trace"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
color-eyre = { version = "0.6.5", features = ["tracing-error", "track-caller"] }

# Windows Specific
winres = { version = "0.1.12" }

# Build
chrono = { version = "0.4.45" }
walkdir = { version = "2.5.0" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
debug-assertions = false
strip = "symbols"