[workspace]
resolver = "3"
members = ["crates/shared", "apps/rust/egui", 'apps/rust/gpui', "apps/rust/iced", "apps/rust/tauri/src-tauri"]
default-members = ["crates/shared", "apps/rust/egui", 'apps/rust/gpui', "apps/rust/iced"]

[workspace.dependencies]
tracing = { version = "0.1", features = ["max_level_trace"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
color-eyre = { version = "0.6.5", features = ["tracing-error", "track-caller"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
todo_commonlib = { path = "crates/shared" }
aurora_fonts = { version = "0.1" }
aurora_iconify = { version="0.4.0", features = ["lucide", "material-symbols"] }

# Windows Specific
winres = { version = "0.1.12" }

# Build
chrono = { version = "0.4.45" }
walkdir = { version = "2.5.0" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
debug-assertions = false
strip = true