[package]
name = "todo_commonlib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { version = "0.6.5", features = ["tracing-error", "track-caller"] }
chrono = { workspace = true }
tar = { version = "0.4.43" }
xz2 = { version = "0.1.7" }

[features]
tests = []