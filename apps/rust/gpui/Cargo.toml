[package]
name = "gpui_todo_app"
version = "0.1.0"
edition = "2024"

[lib]
name = "gpui_todo_app_lib"
path = "src/lib.rs"

[dependencies]
gpui = { version = "0.2" }
todo_commonlib = {workspace = true}
aurora_fonts = { workspace = true }
aurora_iconify = { workspace = true }

tokio = { workspace = true }
color-eyre = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winres = { workspace = true }
