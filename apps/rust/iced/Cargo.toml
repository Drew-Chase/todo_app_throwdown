[package]
name = "iced_todo_app"
version = "0.1.0"
edition = "2024"

[lib]
name = "iced_todo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "./src/lib.rs"

[dependencies]
todo_commonlib = {workspace = true}
iced = { version = "0.14", default-features = false, features = ["canvas", "advanced", "svg", "lazy", "sipper", "advanced-shaping", "web-colors", "crisp", "tiny-skia", "thread-pool", "x11", "wayland"] }
iced_borderless_window_resize_handle_widget = { version = "0.1" }

color-eyre = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
aurora_fonts = { workspace = true }
aurora_iconify = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winres = { workspace = true }
